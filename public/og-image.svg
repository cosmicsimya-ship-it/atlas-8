<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ATLAS — Cosmic Simya">
  <defs>
    <radialGradient id="bg" cx="70%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#182033"/>
      <stop offset="48%" stop-color="#090c12"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f4fa"/>
      <stop offset="52%" stop-color="#cfd6e2"/>
      <stop offset="100%" stop-color="#65718c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe6ff"/>
      <stop offset="55%" stop-color="#6ea8f7"/>
      <stop offset="100%" stop-color="#2f4e9a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="910" cy="315" r="190" fill="none" stroke="#d9dadd" stroke-opacity="0.12" stroke-width="1.4"/>
  <circle cx="910" cy="315" r="145" fill="none" stroke="#d9dadd" stroke-opacity="0.07" stroke-width="1"/>

  <!-- canonical eight-point North Star family -->
  <g transform="translate(910 315)" filter="url(#glow)">
    <polygon points="0,-165 24,-42 116,-116 42,-24 165,0 42,24 116,116 24,42 0,165 -24,42 -116,116 -42,24 -165,0 -42,-24 -116,-116 -24,-42" fill="url(#silver)" opacity="0.92"/>
    <polygon points="0,-82 18,-24 58,-58 24,-18 82,0 24,18 58,58 18,24 0,82 -18,24 -58,58 -24,18 -82,0 -24,-18 -58,-58 -18,-24" fill="url(#blue)" opacity="0.9" transform="rotate(22.5)"/>
    <circle r="18" fill="#32477f"/>
  </g>

  <text x="96" y="252" fill="#f2efe8" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="600">ATLAS</text>
  <text x="96" y="322" fill="#c9b37a" font-family="Arial, Helvetica, sans-serif" font-size="27" letter-spacing="6">COSMIC SIMYA</text>
  <text x="96" y="390" fill="#b8b3aa" font-family="Arial, Helvetica, sans-serif" font-size="27">Her şey zaten ortada. Mesele nasıl okuduğun.</text>
  <text x="96" y="445" fill="#7f8794" font-family="Arial, Helvetica, sans-serif" font-size="22">cosmicsimya.com</text>
</svg>
